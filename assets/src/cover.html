<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover — Voice Order Support Agent</title>
<style>
  @page { size: 1920px 1080px; margin: 0; }
  html, body { margin: 0; width: 1920px; height: 1080px; }
  body {
    background: radial-gradient(1200px 700px at 78% 30%, #1e1b4b 0%, #0b0f17 60%) #0b0f17;
    color: #e8ecf4;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .wrap { position: absolute; left: 120px; top: 150px; width: 1000px; }
  .kicker {
    font-size: 26px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase;
    color: #a5b4fc;
  }
  h1 { font-size: 104px; line-height: 1.02; margin: 26px 0 0; letter-spacing: -2px; font-weight: 800; }
  .tag { margin-top: 36px; font-size: 40px; line-height: 1.3; color: #cbd5e1; max-width: 900px; }
  .tag b { color: #fff; }
  .stack {
    position: absolute; left: 120px; bottom: 110px; font-size: 26px; color: #94a3b8;
    letter-spacing: .5px;
  }
  .stack span { color: #e2e8f0; font-weight: 600; }
  /* The picture: the agent's speech, cut the instant the shopper speaks. */
  svg { position: absolute; right: 90px; top: 190px; }
  .badge {
    position: absolute; right: 150px; top: 700px; font-size: 26px; font-weight: 700;
    color: #0b0f17; background: #34d399; padding: 12px 22px; border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="kicker">AssemblyAI Voice Agent Hackathon</div>
    <h1>Voice Order<br>Support Agent</h1>
    <div class="tag">Interrupt it any time. It <b>stops at once</b> — and remembers <b>only what you heard</b>.</div>
  </div>

  <svg width="700" height="480" viewBox="0 0 700 480" aria-hidden="true">
    <defs>
      <linearGradient id="agent" x1="0" x2="1">
        <stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#6366f1"/>
      </linearGradient>
    </defs>
    <!-- agent speech -->
    <g fill="url(#agent)">
      <rect x="10" y="190" width="14" height="100" rx="7"/>
      <rect x="40" y="150" width="14" height="180" rx="7"/>
      <rect x="70" y="120" width="14" height="240" rx="7"/>
      <rect x="100" y="170" width="14" height="140" rx="7"/>
      <rect x="130" y="100" width="14" height="280" rx="7"/>
      <rect x="160" y="140" width="14" height="200" rx="7"/>
      <rect x="190" y="180" width="14" height="120" rx="7"/>
      <rect x="220" y="110" width="14" height="260" rx="7"/>
      <rect x="250" y="160" width="14" height="160" rx="7"/>
      <rect x="280" y="130" width="14" height="220" rx="7"/>
      <rect x="310" y="175" width="14" height="130" rx="7"/>
    </g>
    <!-- the cut -->
    <line x1="345" y1="40" x2="345" y2="440" stroke="#34d399" stroke-width="5" stroke-dasharray="14 10"/>
    <!-- what was not said: flushed -->
    <g fill="#334155" opacity=".55">
      <rect x="370" y="200" width="14" height="80" rx="7"/>
      <rect x="400" y="170" width="14" height="140" rx="7"/>
      <rect x="430" y="210" width="14" height="60" rx="7"/>
      <rect x="460" y="185" width="14" height="110" rx="7"/>
    </g>
    <!-- the shopper, talking over it -->
    <g fill="#34d399">
      <rect x="520" y="215" width="14" height="50" rx="7"/>
      <rect x="550" y="160" width="14" height="160" rx="7"/>
      <rect x="580" y="120" width="14" height="240" rx="7"/>
      <rect x="610" y="170" width="14" height="140" rx="7"/>
      <rect x="640" y="200" width="14" height="80" rx="7"/>
    </g>
  </svg>
  <div class="badge">Barge-in, for real</div>

  <div class="stack">
    <span>AssemblyAI Realtime STT</span> · own orchestration · Groq gpt-oss-120b · Orpheus TTS · live on Replit
  </div>
</body>
</html>
